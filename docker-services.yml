version: "3.9"

services:

  user-service:
    image: iamamithari/user-service:1.0
    ports:
      - "8081:8081"
    networks:
      - microservices-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker-2
      restart_policy:
        condition: on-failure

  hotel-service:
    image: iamamithari/hotel-service:1.0
    ports:
      - "8082:8082"
    networks:
      - microservices-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker-1
      restart_policy:
        condition: on-failure

  rating-service:
    image: iamamithari/rating-service:1.0
    ports:
      - "8083:8083"
    networks:
      - microservices-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == worker-2
      restart_policy:
        condition: on-failure

networks:
  microservices-network:
    external: true