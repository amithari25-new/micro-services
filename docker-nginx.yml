version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-network
    deploy:
      replicas: 1
#      placement:
#        constraints:
#          - node.hostname == manager
      restart_policy:
        condition: on-failure

  discovery-service:
    image: iamamithari/discovery-service:1.0
    ports:
      - "8761:8761"
    networks:
      - microservices-network
    deploy:
      replicas: 1
#      placement:
#        constraints:
#          - node.hostname == manager
      restart_policy:
        condition: on-failure

  api-gateway:
    image: iamamithari/api-gateway:1.0
#    ports:
#      - "8084:8084"
    networks:
      - microservices-network
    deploy:
      replicas: 2
#      placement:
#        constraints:
#          - node.hostname == worker-1
      restart_policy:
        condition: on-failure

networks:
  microservices-network:
    driver: overlay
    external: true