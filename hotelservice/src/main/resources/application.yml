spring:
  application:
    name: HOTEL-SERVICE
  data:
    mongodb:
      uri: mongodb://root:password@mongo:27017/mydb?authSource=admin
      database: mydb
  depends:
    mongo

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka